version: 2

models:
  - name: stg_events
    description: "Canonical, source-aware event model normalized across Last.fm and YouTube Music (Takeout)."
    columns:
      - name: event_id
        description: "Deterministic hash of (timestamp, unix_timestamp, source); one row per event."
        tests: [unique, not_null]
      - name: event_timestamp
        tests: [not_null]
      - name: source
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['youtube_takeout', 'lastfm_scrobble']
      - name: event_type
        tests:
          - accepted_values:
              arguments:
                values: ['music', 'non_music']
      - name: artist_type
        tests:
          - accepted_values:
              arguments:
                values: ['artist', 'label_or_channel']
      - name: time_of_day
        tests:
          - accepted_values:
              arguments:
                values: ['morning', 'afternoon', 'evening', 'night']
      - name: is_valid_music_event
        tests: [not_null]
