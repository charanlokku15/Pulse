version: 2

models:
  - name: stg_listening_events
    description: "Cleaned listening events from Last.fm raw data"
    columns:
      - name: play_id
        description: "Unique identifier for each play (unix timestamp)"
        tests:
          - unique
          - not_null
      - name: track_name
        tests:
          - not_null
      - name: artist_clean
        description: "Cleaned artist name — playlists replaced with Unknown Artist"
      - name: played_at
        tests:
          - not_null