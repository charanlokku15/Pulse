name: Deploy Pulse

on:
  push:
    branches: [main]
    paths:
      - 'ingestion/**'
      - 'pulse_dbt/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - 'requirements.docker.txt'
      - 'profiles.docker.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPO: pulse-pipeline
  ECS_FAMILY: pulse-pipeline

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::779691446000:role/pulse-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:latest

      - name: Register new task definition revision
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPO }}:${{ github.sha }}
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_FAMILY" \
            --query 'taskDefinition' --output json > taskdef.json

          jq --arg IMAGE "$IMAGE" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' taskdef.json > taskdef.new.json

          aws ecs register-task-definition \
            --cli-input-json file://taskdef.new.json \
            --query 'taskDefinition.{family:family,revision:revision,image:containerDefinitions[0].image}' \
            --output table
