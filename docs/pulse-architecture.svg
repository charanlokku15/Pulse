<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
    <style>
      .lbl{fill:#1f2933;font-size:14px;font-weight:600}
      .sub{fill:#52616b;font-size:11px}
      .band{fill:#8a97a5;font-size:12px;font-weight:700;letter-spacing:.5px}
      .flow{stroke:#5b6b7b;stroke-width:2;fill:none;marker-end:url(#arr)}
      .src{fill:#eef3f8;stroke:#b7c6d6}
      .durable{fill:#e7f2ec;stroke:#7fb79a}
      .compute{fill:#fdf1e3;stroke:#e0b17a}
      .out{fill:#eef3f8;stroke:#b7c6d6}
      .ops{fill:#f4f0f8;stroke:#c3b3d9}
      .title{fill:#12202e;font-size:22px;font-weight:700}
      .cap{fill:#7a8794;font-size:12px;font-style:italic}
    </style>
  </defs>

  <text x="30" y="40" class="title">Pulse — Architecture</text>
  <text x="30" y="60" class="cap">Durable raw data in S3. The warehouse and compute are rebuilt from it each run, then discarded.</text>

  <!-- ===================== CORE DATA FLOW BAND ===================== -->
  <rect x="24" y="82" width="1072" height="300" rx="10" fill="#fbfcfd" stroke="#e4e9ee"/>
  <text x="44" y="104" class="band">CORE DATA FLOW</text>

  <!-- Sources -->
  <rect x="44" y="150" width="150" height="70" rx="8" class="src"/>
  <text x="60" y="180" class="lbl">YouTube Music</text>
  <text x="60" y="198" class="sub">Google Takeout export</text>
  <rect x="44" y="238" width="150" height="70" rx="8" class="src"/>
  <text x="60" y="268" class="lbl">Last.fm</text>
  <text x="60" y="286" class="sub">scrobble API</text>

  <!-- S3 durable -->
  <rect x="248" y="194" width="150" height="70" rx="8" class="durable"/>
  <text x="268" y="224" class="lbl">S3 — raw/</text>
  <text x="268" y="242" class="sub">durable source of truth</text>

  <!-- Fargate compute box (dashed = disposable) -->
  <rect x="452" y="120" width="356" height="224" rx="10" class="compute" stroke-dasharray="6 4"/>
  <text x="470" y="144" class="band" fill="#b07b34">FARGATE TASK — disposable compute</text>

  <rect x="472" y="162" width="150" height="52" rx="7" fill="#fff" stroke="#e0b17a"/>
  <text x="486" y="186" class="lbl">load_to_duckdb</text>
  <text x="486" y="202" class="sub">idempotent load</text>

  <rect x="472" y="230" width="150" height="52" rx="7" fill="#fff" stroke="#e0b17a"/>
  <text x="486" y="254" class="lbl">dbt run + test</text>
  <text x="486" y="270" class="sub">stg_events + 7 marts</text>

  <rect x="472" y="298" width="150" height="34" rx="7" fill="#fff" stroke="#e0b17a"/>
  <text x="486" y="320" class="lbl">generate_report</text>

  <rect x="648" y="162" width="140" height="170" rx="7" fill="#fff" stroke="#e0b17a"/>
  <text x="664" y="186" class="lbl">DuckDB</text>
  <text x="664" y="204" class="sub">ephemeral</text>
  <text x="664" y="222" class="sub">warehouse,</text>
  <text x="664" y="240" class="sub">rebuilt each run</text>
  <text x="664" y="272" class="sub">Python · SQL · dbt</text>

  <!-- Outputs -->
  <rect x="862" y="194" width="150" height="70" rx="8" class="out"/>
  <text x="878" y="222" class="lbl">S3 — reports/</text>
  <text x="878" y="240" class="sub">report .md + .json</text>

  <!-- flows -->
  <path class="flow" d="M194,185 C220,185 224,215 246,220"/>
  <path class="flow" d="M194,273 C220,273 224,240 246,238"/>
  <path class="flow" d="M398,229 C420,229 430,210 450,205"/>
  <path class="flow" d="M808,229 C832,229 840,229 860,229"/>

  <!-- ===================== OPERATING LAYER BAND ===================== -->
  <rect x="24" y="404" width="1072" height="212" rx="10" class="ops"/>
  <text x="44" y="428" class="band" fill="#7a5ea8">OPERATING LAYER — deployed, scheduled, secured, monitored, as code</text>

  <rect x="44"  y="446" width="150" height="66" rx="8" fill="#fff" stroke="#c3b3d9"/>
  <text x="60" y="476" class="lbl">EventBridge</text>
  <text x="60" y="494" class="sub">daily schedule</text>

  <rect x="212" y="446" width="150" height="66" rx="8" fill="#fff" stroke="#c3b3d9"/>
  <text x="228" y="476" class="lbl">ECR</text>
  <text x="228" y="494" class="sub">image registry</text>

  <rect x="380" y="446" width="150" height="66" rx="8" fill="#fff" stroke="#c3b3d9"/>
  <text x="396" y="476" class="lbl">IAM + SSM</text>
  <text x="396" y="494" class="sub">least-priv · secret</text>

  <rect x="548" y="446" width="180" height="66" rx="8" fill="#fff" stroke="#c3b3d9"/>
  <text x="564" y="476" class="lbl">CloudWatch + SNS</text>
  <text x="564" y="494" class="sub">logs · failure alarm → email</text>

  <rect x="746" y="446" width="150" height="66" rx="8" fill="#fff" stroke="#c3b3d9"/>
  <text x="762" y="476" class="lbl">Terraform</text>
  <text x="762" y="494" class="sub">whole stack as code</text>

  <rect x="914" y="446" width="160" height="66" rx="8" fill="#fff" stroke="#c3b3d9"/>
  <text x="930" y="476" class="lbl">GitHub Actions</text>
  <text x="930" y="494" class="sub">OIDC · build → ECR → ECS</text>

  <text x="44" y="560" class="sub">Push to main  →  GitHub Actions builds the arm64 image (keyless OIDC auth), pushes to ECR, and registers a new ECS task definition.</text>
  <text x="44" y="582" class="sub">EventBridge triggers the Fargate task daily; it reads raw/ from S3, rebuilds the warehouse, runs dbt + tests, writes the report back to S3.</text>
  <text x="44" y="604" class="sub">Every resource above is defined in Terraform and reproducible with a single apply.</text>
</svg>
