<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#5b6b7b"/>
    </marker>
    <style>
      .t{fill:#12202e;font-size:22px;font-weight:700}
      .cap{fill:#7a8794;font-size:12px;font-style:italic}
      .lbl{fill:#1f2933;font-size:14px;font-weight:600}
      .sub{fill:#52616b;font-size:11px}
      .mart{fill:#1f2933;font-size:13px;font-weight:600}
      .src{fill:#eef3f8;stroke:#b7c6d6}
      .canon{fill:#e7f2ec;stroke:#7fb79a}
      .m{fill:#fff;stroke:#b7c6d6}
      .flow{stroke:#5b6b7b;stroke-width:2;fill:none;marker-end:url(#a2)}
      .flowl{stroke:#c2ccd6;stroke-width:1.5;fill:none;marker-end:url(#a2)}
    </style>
  </defs>

  <text x="30" y="40" class="t">Pulse — Data Model</text>
  <text x="30" y="60" class="cap">Two sources, one canonical event model, seven behavioral marts. Source semantics preserved, never blended blindly.</text>

  <!-- sources -->
  <rect x="30" y="150" width="170" height="60" rx="8" class="src"/>
  <text x="46" y="178" class="lbl">YouTube Takeout</text>
  <text x="46" y="196" class="sub">watch/listen history</text>

  <rect x="30" y="250" width="170" height="60" rx="8" class="src"/>
  <text x="46" y="278" class="lbl">Last.fm scrobbles</text>
  <text x="46" y="296" class="sub">near-live plays</text>

  <!-- canonical -->
  <rect x="290" y="170" width="220" height="120" rx="10" class="canon"/>
  <text x="310" y="200" class="lbl">stg_events</text>
  <text x="310" y="220" class="sub">canonical, source-aware</text>
  <text x="310" y="240" class="sub">event_id · source · event_type</text>
  <text x="310" y="257" class="sub">is_valid_music_event</text>
  <text x="310" y="274" class="sub">artist_type · movie · played_at</text>

  <!-- marts -->
  <rect x="620" y="40"  width="250" height="40" rx="7" class="m"/><text x="638" y="65" class="mart">mart_top_tracks</text>
  <rect x="620" y="92"  width="250" height="40" rx="7" class="m"/><text x="638" y="117" class="mart">mart_top_artists</text>
  <rect x="620" y="144" width="250" height="40" rx="7" class="m"/><text x="638" y="169" class="mart">mart_artist_trends</text>
  <rect x="620" y="196" width="250" height="40" rx="7" class="m"/><text x="638" y="221" class="mart">mart_listening_by_time</text>
  <rect x="620" y="248" width="250" height="40" rx="7" class="m"/><text x="638" y="273" class="mart">mart_recent_tracks</text>
  <rect x="620" y="300" width="250" height="40" rx="7" class="m"/><text x="638" y="325" class="mart">mart_discovery</text>
  <rect x="620" y="352" width="250" height="40" rx="7" class="m"/><text x="638" y="377" class="mart">mart_activity</text>

  <!-- flows in -->
  <path class="flow" d="M200,180 C240,180 250,215 288,222"/>
  <path class="flow" d="M200,280 C240,280 250,245 288,238"/>

  <!-- flows out -->
  <path class="flowl" d="M510,215 C560,215 575,60 618,60"/>
  <path class="flowl" d="M510,220 C560,220 575,112 618,112"/>
  <path class="flowl" d="M510,225 C560,225 575,164 618,164"/>
  <path class="flowl" d="M510,230 C560,230 578,216 618,216"/>
  <path class="flowl" d="M510,235 C560,235 575,268 618,268"/>
  <path class="flowl" d="M510,240 C560,240 575,320 618,320"/>
  <path class="flowl" d="M510,245 C560,245 575,372 618,372"/>

  <!-- report -->
  <rect x="620" y="430" width="250" height="70" rx="8" class="canon"/>
  <text x="638" y="460" class="lbl">generate_report</text>
  <text x="638" y="480" class="sub">deterministic report (.md + .json)</text>
  <path class="flowl" d="M745,392 L745,428"/>

  <text x="30" y="470" class="sub">9 dbt tests on stg_events:</text>
  <text x="30" y="490" class="sub">unique/not-null keys +</text>
  <text x="30" y="510" class="sub">accepted-values on source,</text>
  <text x="30" y="530" class="sub">event_type, artist_type, time_of_day</text>
</svg>
